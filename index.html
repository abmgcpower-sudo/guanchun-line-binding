<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06C755">
  <title>GUANCHUN｜LINE 通知接收者綁定</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; color: #172334; font-family: -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    main { max-width: 560px; margin: 32px auto; padding: 0 18px; }
    .panel { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 26px #1723340d; }
    .brand { color: #06a846; font-weight: 800; letter-spacing: 1px; font-size: 15px; }
    h1 { font-size: 25px; margin: 12px 0; }
    p { line-height: 1.75; }
    .note { background: #f6f8fa; border-radius: 12px; padding: 14px; font-size: 14px; }
    #status { font-weight: 650; }
    .output { background: #f8fafc; border: 1px solid #d7dee5; border-radius: 10px; padding: 12px; word-break: break-all; user-select: all; font-family: ui-monospace,Consolas,monospace; }
    button { display: block; border: 0; border-radius: 10px; padding: 14px 18px; width: 100%; font-size: 16px; font-weight: 700; margin-top: 12px; background: #06c755; color: white; cursor: pointer; }
    button:disabled { background: #a1aab6; cursor: not-allowed; }
    .secondary { background: #e7edf4; color: #172334; }
    .small { font-size: 13px; color: #526173; }
    #identity { display: none; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <main>
    <section class="panel">
      <div class="brand">GUANCHUN · GC-WLM-01</div>
      <h1>LINE 漏水警報接收者綁定</h1>
      <p>使用自己的 LINE 帳號取得通知識別碼，再交由設備管理員 ADMIN 審核。<strong>掃描本頁不會自動取得通知權限。</strong></p>
      <div class="note" id="status" role="status">網頁載入中…</div>
      <div id="identity">
        <p>LINE 顯示名稱：<strong id="displayName">—</strong></p>
        <p>個人 LINE User ID：</p>
        <div class="output" id="userId">—</div>
        <button id="copyBtn" type="button">複製我的 User ID</button>
        <button id="shareBtn" class="secondary" type="button">分享我的 User ID 給管理員</button>
        <p class="small">請先將發送通知的冠群官方帳號加入好友，且不要封鎖。只有 ADMIN 核准後，才會正式收到警報通知。</p>
      </div>
      <p class="small">本網頁只讀取登入者授權提供的基本 LINE 資訊，不會在 GitHub Pages 儲存個人 User ID。切勿在本頁輸入 LINE 密碼、Channel secret 或 Channel Access Token。</p>
    </section>
  </main>
  <script>
    // 首次部署版本：LIFF ID 待核發，先確認 HTTPS 網站正常運作。
    // 正式啟用時以完整正式版 index.html 取代此檔，不需手動修改片段。
    const LIFF_ID = "";
    const statusEl = document.getElementById('status');
    const identityEl = document.getElementById('identity');
    const nameEl = document.getElementById('displayName');
    const userEl = document.getElementById('userId');
    function status(message) { statusEl.textContent = message; }
    async function init() {
      if (!LIFF_ID) {
        status('網站已部署準備中。請先在 LINE Developers 建立 LIFF App，取得 LIFF ID 後才能啟用個人 LINE 綁定。');
        return;
      }
      if (!window.liff) { status('無法載入 LINE LIFF SDK，請確認網路連線。'); return; }
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        const profile = await liff.getProfile();
        const id = profile.userId || '';
        if (!/^U[0-9a-f]{32}$/.test(id)) throw new Error('無法取得有效的個人 User ID');
        nameEl.textContent = profile.displayName || '個人 LINE 使用者';
        userEl.textContent = id;
        identityEl.style.display = 'block';
        status('已成功取得個人 LINE User ID，請交給設備 ADMIN 審核。');
        document.getElementById('copyBtn').onclick = async () => {
          try { await navigator.clipboard.writeText(id); status('User ID 已複製。'); }
          catch (_) { status('無法自動複製，請長按上方 User ID 手動複製。'); }
        };
        document.getElementById('shareBtn').onclick = async () => {
          const message = `GUANCHUN LINE 通知接收者\n名稱：${profile.displayName || '使用者'}\nUser ID：${id}\n請由 ADMIN 確認後新增。`;
          if (navigator.share) {
            try { await navigator.share({ text: message }); } catch (_) {}
          } else {
            try { await navigator.clipboard.writeText(message); status('申請資料已複製，請貼給管理員。'); }
            catch (_) { status('請長按 User ID 複製後傳給管理員。'); }
          }
        };
      } catch (err) {
        status('LINE 登入或取得資料失敗：' + (err && err.message ? err.message : '未知錯誤'));
      }
    }
    init();
  </script>
</body>
</html>
